name: Publish Spiritbound

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Check puzzle, animation, startup, and audio
        run: |
          godot --headless --path . --script tests/run_room.gd
          godot --headless --path . --script tests/run_animation.gd
          godot --headless --path . --script tests/run_splash.gd
          godot --headless --path . --script tests/run_audio.gd
      - name: Export browser build
        run: |
          mkdir -p builds/web
          godot --headless --path . --export-release Web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
